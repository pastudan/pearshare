name: Release macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create GitHub Releases and upload assets

jobs:
  release:
    runs-on: macos-latest

    env:
      PROJECT: clients/macos/PearShare.xcodeproj
      SCHEME: PearShare
      ARCHIVE_PATH: .build/PearShare.xcarchive
      EXPORT_PATH: .build/PearShare-export
      KEYCHAIN_NAME: pearshare-ci
      KEYCHAIN_PASSWORD: ci-temp-keychain

    steps:
      - uses: actions/checkout@v4

      # ── Xcode version ────────────────────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ── Install create-dmg ───────────────────────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      # ── Import Developer ID certificate into a temporary keychain ─────────────
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME.keychain"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME.keychain"

          security import /tmp/certificate.p12 \
            -k "$KEYCHAIN_NAME.keychain" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild

          security list-keychains -d user -s "$KEYCHAIN_NAME.keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME.keychain"

          rm -f /tmp/certificate.p12

      # ── Archive ──────────────────────────────────────────────────────────────
      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_NAME.keychain" \
            -quiet

      # ── Export with Developer ID ─────────────────────────────────────────────
      - name: Export archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates

      # ── Notarize .app ─────────────────────────────────────────────────────────
      - name: Notarize .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$EXPORT_PATH/PearShare.app"
          ZIP_PATH=".build/PearShare-notarize.zip"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_APP_PASSWORD" \
            --wait \
            --timeout 15m

          xcrun stapler staple "$APP_PATH"
          rm -f "$ZIP_PATH"

      # ── Create .dmg ───────────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME}"   # e.g. v1.0.0
          DMG_NAME="PearShare-${VERSION}.dmg"

          create-dmg \
            --volname "PearShare" \
            --volicon "$EXPORT_PATH/PearShare.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PearShare.app" 175 190 \
            --hide-extension "PearShare.app" \
            --app-drop-link 425 190 \
            ".build/${DMG_NAME}" \
            "$EXPORT_PATH/PearShare.app" \
          || true   # create-dmg exits 2 when used without a code-signed background; treat as success

          echo "DMG_PATH=.build/${DMG_NAME}" >> "$GITHUB_ENV"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      # ── Notarize .dmg ─────────────────────────────────────────────────────────
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_APP_PASSWORD" \
            --wait \
            --timeout 15m

          xcrun stapler staple "$DMG_PATH"

      # ── Publish GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"

          gh release create "$VERSION" \
            --title "PearShare ${VERSION}" \
            --generate-notes \
            "$DMG_PATH#${DMG_NAME}"

      # ── Cleanup keychain ──────────────────────────────────────────────────────
      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME.keychain" 2>/dev/null || true
